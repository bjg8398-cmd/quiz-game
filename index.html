<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-top: 30px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #222;
    }

    .hidden {
      display: none;
    }

    .code {
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 5px;
    }

    .player {
      padding: 12px;
      background: #f3f4f6;
      margin: 8px 0;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HOME -->
  <div id="home" class="card">
    <h1>🎮 Quiz Game</h1>
    <p style="text-align:center">
      Multiplayer quiz game
    </p>

    <button onclick="showHost()">Host a Game</button>
    <button class="secondary" onclick="showJoin()">Join a Game</button>
  </div>

  <!-- HOST -->
  <div id="host" class="card hidden">
    <h1>🎤 Host Game</h1>

    <input id="quizName" placeholder="Quiz name">

    <button onclick="createGame()">Create Game</button>
    <button class="secondary" onclick="goHome()">Back</button>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="card hidden">
    <h1>Waiting Room</h1>

    <p style="text-align:center">Game Code</p>

    <div class="code" id="gameCode">482913</div>

    <p style="text-align:center">
      Share this code with your players
    </p>

    <h3>Players</h3>

    <div id="players">
      <div class="player">Waiting for players...</div>
    </div>

     <button id="startGameButton" class="hidden"onclick="startGame()">START GAME</button>
  </div>

  <!-- JOIN -->
  <div id="join" class="card hidden">
    <h1>Join Quiz</h1>

    <input id="joinCode" placeholder="Game Code">

    <input id="playerName" placeholder="Your Name">

    <button onclick="joinGame()">JOIN GAME</button>

    <button class="secondary" onclick="goHome()">Back</button>
  </div>

  <!-- WAITING -->
  <div id="waiting" class="card hidden">
    <h1>🎉 You're In!</h1>

    <p style="text-align:center">
      Waiting for the host to start the game...
    </p>
  </div>

  <!-- QUESTION -->
  <div id="question" class="card hidden">
    <h2>Question 1 / 10</h2>

    <h1 id="questionText">
      What is the capital of France?
    </h1>

    <button onclick="answer('A')">A. London</button>
    <button onclick="answer('B')">B. Paris</button>
    <button onclick="answer('C')">C. Rome</button>
    <button onclick="answer('D')">D. Madrid</button>
  </div>

</div>
<script>
function hideAllScreens() {
  document.querySelectorAll(".card").forEach(function(card) {
    card.classList.add("hidden");
  });
}

window.showHost = function() {
  hideAllScreens();
  document.getElementById("host").classList.remove("hidden");
};

window.showJoin = function() {
  hideAllScreens();
  document.getElementById("join").classList.remove("hidden");
};

window.goHome = function() {
  hideAllScreens();
  document.getElementById("home").classList.remove("hidden");
};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
  getDatabase,
  ref,
  set,
  update,
  onValue} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";



// Import the functions you need from the SDKs you need

// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyATiy7r0UggRombinXdnrmPRwCd98GWpxQ",
  authDomain: "live-quiz-game-79f0e.firebaseapp.com",
  databaseURL: "https://live-quiz-game-79f0e-default-rtdb.firebaseio.com",
  projectId: "live-quiz-game-79f0e",
  storageBucket: "live-quiz-game-79f0e.firebasestorage.app",
  messagingSenderId: "489513542029",
  appId: "1:489513542029:web:c9a61c48a4412408071dc4"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* -------------------------
   SCREEN CONTROL
------------------------- */

function hideAll() {
  document.querySelectorAll(".card").forEach(x => {
    x.classList.add("hidden");
  });
}

window.goHome = function() {
  hideAll();
  document.getElementById("home").classList.remove("hidden");
};

window.showHost = function() {
  hideAll();
  document.getElementById("host").classList.remove("hidden");
};

window.showJoin = function() {
  hideAll();
  document.getElementById("join").classList.remove("hidden");
};


/* -------------------------
   HOST CREATES GAME
------------------------- */

window.createGame = async function() {
  alert("createGame reached");

  const code =
    Math.floor(100000 + Math.random() * 900000).toString();

  document.getElementById("gameCode").innerText = code;
showLobby();
  const gameRef = ref(db, "games/" + code);

  await set(gameRef, {
  status: "waiting",
  questionNumber: 1,

  questions: [
    {
      question: "What is the capital of France?",
      answers: {
        A: "London",
        B: "Paris",
        C: "Rome",
        D: "Madrid"
      },
      correctAnswer: "B"
    },

    {
      question: "Which planet is known as the Red Planet?",
      answers: {
        A: "Earth",
        B: "Venus",
        C: "Mars",
        D: "Jupiter"
      },
      correctAnswer: "C"
    },

    {
      question: "How many continents are there?",
      answers: {
        A: "5",
        B: "6",
        C: "7",
        D: "8"
      },
      correctAnswer: "C"
    }
  
    },
    {
      question: "What is the largest ocean on Earth?",
      answers: {
        A: "Atlantic Ocean",
        B: "Pacific Ocean",
        C: "Indian Ocean",
        D: "Arctic Ocean"
      },
      correctAnswer: "B"
    },
    {
      question: "Which animal is known as the King of the Jungle?",
      answers: {
        A: "Tiger",
        B: "Elephant",
        C: "Lion",
        D: "Bear"
      },
      correctAnswer: "C"
    },
    {
      question: "How many days are there in a leap year?",
      answers: {
        A: "364",
        B: "365",
        C: "366",
        D: "367"
      },
      correctAnswer: "C"
    },
    {
      question: "What is the fastest land animal?",
      answers: {
        A: "Cheetah",
        B: "Lion",
        C: "Horse",
        D: "Tiger"
      },
      correctAnswer: "A"
    },
    {
      question: "Which country is famous for the Great Wall?",
      answers: {
        A: "India",
        B: "China",
        C: "Japan",
        D: "Korea"
      },
      correctAnswer: "B"
    },
    {
      question: "What is the largest planet in our solar system?",
      answers: {
        A: "Earth",
        B: "Saturn",
        C: "Jupiter",
        D: "Neptune"
      },
      correctAnswer: "C"
    },
    {
      question: "How many sides does a hexagon have?",
      answers: {
        A: "5",
        B: "6",
        C: "7",
        D: "8"
      },
      correctAnswer: "B"
    }
  ],

  

  participants: {}
});

  hideAll();
  document.getElementById("lobby").classList.remove("hidden");
document.getElementById("startGameButton").classList.remove("hidden");
  listenToGame(code);
listenForPlayers(code);

/* -------------------------
   PARTICIPANT JOINS
------------------------- */

window.joinGame = function() {

  const code =
    document.getElementById("joinCode").value.trim();

  const playerName =
    document.getElementById("playerName").value.trim();

  if (!code || !playerName) {
    alert("Please enter the game code and your name.");
    return;
  }

  const playerRef =
    ref(db, "games/" + code + "/participants/" + playerName);

  set(playerRef, {
    name: playerName,
    answered: false,
    answer: ""
  });
document.getElementById("gameCode").innerText = code;

hideAll();
document.getElementById("waiting").classList.remove("hidden");
  document.getElementById("startGameButton").classList.add("hidden");

listenToGame(code);
listenForPlayers(code);
};


/* -------------------------
   HOST STARTS GAME
------------------------- */

window.startGame = function() {

  const code =
    document.getElementById("gameCode").innerText.trim();

  if (!code) {
    alert("Game code missing.");
    return;
  }

  update(ref(db, "games/" + code), {
    status: "question"
  });
};


/* -------------------------
   LISTEN FOR GAME CHANGES
------------------------- */

function listenToGame(code) {

  const gameRef = ref(db, "games/" + code);

  onValue(gameRef, snapshot => {

    const game = snapshot.val();

    if (!game) return;


    /* GAME STARTED */

    if (game.status === "question") {

      hideAll();

      document.getElementById("question").classList.remove("hidden");

      document.getElementById("questionText").innerText =
        game.question;

    }

  });
}
function listenForPlayers(code) {

    const playersRef = ref(db, "games/" + code + "/participants");

    onValue(playersRef, snapshot => {

        const players = snapshot.val() || {};
        const playersDiv = document.getElementById("players");

        playersDiv.innerHTML = "";

        const names = Object.values(players);

        if (names.length === 0) {
            playersDiv.innerHTML =
                '<div class="player">Waiting for players...</div>';
            return;
        }

        names.forEach(player => {

            const div = document.createElement("div");

            div.className = "player";
            div.innerText = player.name + (player.answered ? " — Answer: " + player.answer : " — Waiting...");

            playersDiv.appendChild(div);
        });
    });
}

/* -------------------------
   SUBMIT ANSWER
------------------------- */

window.answer = function(choice) {

  const code =
    document.getElementById("joinCode").value.trim();

  const playerName =
    document.getElementById("playerName").value.trim();

  if (!code || !playerName) {
    alert("Game information missing.");
    return;
  }

  update(
    ref(
      db,
      "games/" + code + "/participants/" + playerName
    ),
    {
      answer: choice,
      answered: true
    }
  );

  alert("Answer submitted!");
};

      </script>
